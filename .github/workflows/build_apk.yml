name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Scaffold & Force SDK 36
        run: |
          flutter create . --platforms=android --org com.college.portal --project-name college_app
          
          # Replace compileSdkVersion and targetSdkVersion with 36 directly in build.gradle
          sed -i -E 's/compileSdk(Version)? = .*/compileSdk = 36/g' android/app/build.gradle* || true
          sed -i -E 's/compileSdk(Version)? [0-9]+/compileSdk 36/g' android/app/build.gradle* || true
          sed -i -E 's/compileSdk(Version)? flutter\.compileSdkVersion/compileSdk 36/g' android/app/build.gradle* || true
          sed -i -E 's/targetSdk(Version)? = .*/targetSdk = 36/g' android/app/build.gradle* || true
          sed -i -E 's/targetSdk(Version)? [0-9]+/targetSdk 36/g' android/app/build.gradle* || true
          sed -i -E 's/targetSdk(Version)? flutter\.targetSdkVersion/targetSdk 36/g' android/app/build.gradle* || true

          # Force all subprojects/plugins to compile against SDK 36
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Academic-Portal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
