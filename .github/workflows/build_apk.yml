name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Scaffold
        run: |
          flutter create . --platforms=android --org com.college.portal --project-name college_app
          # Set compileSdk and targetSdk to 35 for androidx 1.16 compatibility
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle* || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Academic-Portal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
